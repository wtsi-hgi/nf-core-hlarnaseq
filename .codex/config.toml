# <repo>/.codex/config.toml
# Use this line to remove all sandbox restrictions (for agent testign only)
# default_permissions = ":danger-full-access"

# The custom permissions that allow localhost port binding a
# and runnign data on the VM
default_permissions = "nextflow"

[permissions.nextflow]
extends = ":workspace"

[permissions.nextflow.network]
enabled = true
allow_local_binding = true

[permissions.nextflow.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"gz3vm"     = "allow"
"172.27.21.152" = "allow"


[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1

[agents.planner]
description = "Planning-focused agent. Produces small, reviewable one-PR plans and uses the /plan-pipeline-change skill."
config_file = "../.agents/roles/planner.toml"

[agents.coder]
description = "Implementation-focused agent. Implements only approved plans using the set of /implement*** skill."
config_file = "../.agents/roles/coder.toml"

[agents.validator]
description = "Evidence-driven validation agent. Runs checks, reviews regressions, and uses the /validate-hlarnaseq skill."
config_file = "../.agents/roles/validator.toml"
