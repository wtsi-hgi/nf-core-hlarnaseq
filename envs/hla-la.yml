# nf-core/hlarnaseq: HLA-LA typing environment (WGS input only).
# Used by HLALA_RUN (modules/local/hlala/run) via `conda run -n hla-la`,
# only needed when running the pipeline with --wgs_samples. Operator-
# prepared precondition - the pipeline never creates, updates, or prepares
# graph data in this environment. See docs/environment_setup.md.
#
# After creating this environment, you must still separately obtain a
# prepared HLA-LA graph directory (e.g. PRG_MHC_GRCh38_withIMGT) and pass
# its parent directory via --hlala_graph_dir; the pipeline does not
# download or build this graph.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::hla-la=1.0.4
